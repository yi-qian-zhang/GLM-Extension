# PLM Memorization Experiment — DNABERT-2 (HuggingFace)
# zhihan1996/DNABERT-2-117M; Genome_Factory-aligned tokenizer and LoRA targets.
# First run will download the model from HuggingFace (requires network).

experiment:
  name: "plm_memorization_dnabert2"
  seed: 456 # 42, 123, 456
  output_dir: "outputs"
  device: "auto"  # Prefer GPU for 117M model; use "cpu" if no GPU

# Model: DNABERT-2 117M (encoder + LM head for next-token prediction)
model:
  name: "zhihan1996/DNABERT-2-117M"
  max_length: 512
  use_lora: false  # Set true for parameter-efficient fine-tuning (Genome_Factory-style)
  lora:
    r: 8
    alpha: 32      # Genome_Factory default for DNABERT-2
    dropout: 0.05
    target_modules: ["Wqkv", "dense", "gated_layers", "wo"]  # MosaicBERT/DNABERT-2 (no classifier)

# Data settings (same structure; tokenizer is DNABERT-2 k-mer)
data:
  mode: "synthetic"  # "synthetic" | "real" | "refseq" | "huggingface" | "mixed"
  num_train_sequences: 1000
  num_test_sequences: 200
  sequence_length: 256
  gc_content: 0.5
  real_data:
    source: "refseq"
    fasta_path: null
    accession: "GCF_000005845.2"
    genome_dir: "data/genomes"
    stride: 256
    hf_dataset: "leannmlindsey/GUE"
    hf_subset: "prom_300_all"
    hf_split: "train"
    bed_path: null
    test_split_ratio: 0.167
  canaries:
    enabled: true
    num_canaries: 100
    canary_length: 64
    repetitions: [1, 5, 10, 20]
    pattern: "CANARY"

# Training (2e-5 is common for BERT-style; reduce batch_size if OOM)
training:
  epochs: 50
  batch_size: 8    # Smaller than simple if GPU memory is limited
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001
  save_every_n_epochs: 0
  save_best: true

# Differential Privacy
privacy:
  enabled: false
  epsilon: 8.0
  delta: 1.0e-5
  max_grad_norm: 1.0
  noise_multiplier: null

# Attack evaluation
attacks:
  perplexity:
    enabled: true
  extraction:
    enabled: true
    beam_width: 10
    max_candidates: 1000
  mia:
    enabled: true
    threshold_percentiles: [50, 75, 90, 95, 99]
  reconstruction:
    enabled: true
    prefix_lengths: [0.25, 0.5, 0.75]

# Visualization
visualization:
  save_plots: true
  plot_format: "png"
  dpi: 150
