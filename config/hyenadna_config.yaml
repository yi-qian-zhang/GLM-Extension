# PLM Memorization Experiment — HyenaDNA (HuggingFace)
# Example: LongSafari/hyenadna-medium-160k-seqlen-hf

experiment:
  name: "plm_memorization_hyenadna"
  seed: 456 # 42, 123, 456
  output_dir: "outputs"
  device: "auto"  # Prefer GPU; use "cpu" if no GPU

# Model: HyenaDNA medium (encoder + LM head for next-token prediction)
model:
  name: "LongSafari/hyenadna-medium-160k-seqlen-hf"
  max_length: 512         # Our synthetic sequences are 256bp; 512 is safe
  use_lora: false         # Enable later if you want PEFT
  lora:
    r: 8
    alpha: 32
    dropout: 0.05
    target_modules: ["all"]   # Interpreted as all linear layers in encoder

# Data settings (same structure; tokenizer is HyenaDNA's)
data:
  mode: "synthetic"  # "synthetic" | "real" | "refseq" | "huggingface" | "mixed"
  num_train_sequences: 1000
  num_test_sequences: 200
  sequence_length: 256
  gc_content: 0.5
  real_data:
    source: "refseq"
    fasta_path: null
    accession: "GCF_000005845.2"
    genome_dir: "data/genomes"
    stride: 256
    hf_dataset: "leannmlindsey/GUE"
    hf_subset: "prom_300_all"
    hf_split: "train"
    bed_path: null
    test_split_ratio: 0.167
  canaries:
    enabled: true
    num_canaries: 100
    canary_length: 64
    repetitions: [1, 5, 10, 20]
    pattern: "CANARY"

# Training (you may need to reduce batch_size if OOM)
training:
  epochs: 50
  batch_size: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001
  save_every_n_epochs: 0
  save_best: true

# Differential Privacy
privacy:
  enabled: false
  epsilon: 8.0
  delta: 1.0e-5
  max_grad_norm: 1.0
  noise_multiplier: null

# Attack evaluation
attacks:
  perplexity:
    enabled: true
  extraction:
    enabled: true
    beam_width: 10
    max_candidates: 1000
  mia:
    enabled: true
    threshold_percentiles: [50, 75, 90, 95, 99]
  reconstruction:
    enabled: true
    prefix_lengths: [0.25, 0.5, 0.75]

# Visualization
visualization:
  save_plots: true
  plot_format: "png"
  dpi: 150

